services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interviewlab
      POSTGRES_USER: interviewlab
      POSTGRES_PASSWORD: interviewlab-local-only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - interviewlab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewlab -d interviewlab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  interviewlab_postgres:
